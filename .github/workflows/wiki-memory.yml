name: Wiki Memory Gate

on:
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiki-memory:
    runs-on: ubuntu-latest
    env:
      WIKI_BASE_REF: origin/main
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch branches
        run: |
          git fetch origin main || true
          git fetch origin master || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Lint wiki
        run: python tools/memory/lint_wiki.py

      - name: Domain coverage
        run: python tools/memory/domain_coverage.py --base-ref "$WIKI_BASE_REF"

      - name: Check PR wiki gate
        run: python tools/memory/check_pr_wiki_gate.py
