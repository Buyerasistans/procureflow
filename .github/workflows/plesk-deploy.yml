# .github/workflows/plesk-deploy.yml
# GitHub Actions ile otomatik Plesk deploy pipeline'ı

name: Plesk Deploy

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Checkout Et
        uses: actions/checkout@v4

      - name: SSH ile Plesk'e Deploy Et
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 213.238.191.177
          username: admin
          password: ${{ secrets.PLESK_SSH_PASSWORD }}
          port: 22
          script: |
            cd /var/www/vhosts/buyerassistans.com.tr/httpdocs
            rsync -av --exclude='.venv' --exclude='node_modules' --exclude='.git' $GITHUB_WORKSPACE/ .
            source /var/www/vhosts/buyerassistans.com.tr/venv/bin/activate
            pip install --upgrade pip pip-tools
            if [ -f "api/requirements.in" ]; then
              pip-compile api/requirements.in --no-upgrade -o api/requirements.txt
              cp api/requirements.txt requirements.txt
            fi
            pip install -r api/requirements.txt
            if [ -f "web/package.json" ]; then
              cd web
              npm install
              npm run build
              cd ..
            fi
            if [ -f "api/alembic.ini" ]; then
              source /var/www/vhosts/buyerassistans.com.tr/venv/bin/activate
              cd api
              alembic upgrade head
              cd ..
            fi
            # systemctl restart myapp.service
