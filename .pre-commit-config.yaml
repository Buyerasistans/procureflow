repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        exclude: ^(api/scripts/debug/fix_users_is_active\.py|api/legacy_models\.py)$
        additional_dependencies: []
        args: ["--ignore-missing-imports"]
  - repo: local
    hooks:
      - id: wiki-lint
        name: wiki-lint
        entry: python tools/memory/lint_wiki.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
